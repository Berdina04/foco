<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:"
    />
    <title>Foco</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      #card {
        margin: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18), 0 2px 6px rgba(0, 0, 0, 0.08);
        padding: 14px 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        animation: slide-in 0.25s ease-out;
        -webkit-app-region: drag;
      }
      #card button,
      #card input,
      #card textarea,
      #card details,
      #card a {
        -webkit-app-region: no-drag;
      }
      #card.escalated {
        border-color: var(--warn);
        box-shadow: 0 0 0 3px var(--warn-soft), 0 10px 30px rgba(0, 0, 0, 0.18);
      }
      @keyframes slide-in {
        from {
          transform: translateX(30px);
          opacity: 0;
        }
      }
      .head {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .icon {
        font-size: 22px;
        line-height: 1;
        padding-top: 2px;
      }
      .head h3 {
        font-size: 14.5px;
      }
      .head p {
        font-size: 12.5px;
        color: var(--muted);
      }
      .x {
        border: 0;
        background: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 15px;
        padding: 0 2px;
        margin-left: auto;
      }
      .insight {
        background: var(--surface-2);
        border-radius: 12px;
        padding: 10px 12px;
        display: grid;
        gap: 6px;
        font-size: 13px;
      }
      .insight .q {
        font-weight: 650;
        font-size: 13.5px;
      }
      .insight .step {
        border-left: 3px solid var(--accent);
        padding-left: 8px;
      }
      details summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 12.5px;
      }
      details ul {
        margin: 6px 0 0;
        padding-left: 16px;
        display: grid;
        gap: 4px;
        font-size: 12.5px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .actions .btn {
        padding: 6px 11px;
        font-size: 13px;
      }
      .links {
        display: flex;
        gap: 12px;
        font-size: 12px;
      }
      .links a {
        color: var(--muted);
        cursor: pointer;
        text-decoration: none;
      }
      .links a:hover {
        color: var(--text);
      }
      textarea {
        min-height: 56px;
        font-size: 13px;
      }
      input[type='text'] {
        padding: 7px 11px;
        font-size: 13px;
      }
      .btn.recording {
        background: var(--danger);
        border-color: var(--danger);
        color: #fff;
      }
      .level {
        display: flex;
        gap: 3px;
        align-items: center;
        height: 18px;
      }
      .level i {
        width: 4px;
        border-radius: 2px;
        background: var(--accent);
        height: 4px;
        transition: height 0.08s;
      }
      .note {
        font-size: 12.5px;
        color: var(--muted);
      }
      .row-center {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        flex-shrink: 0;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="card"></div>
    <script type="module" src="toast.js"></script>
  </body>
</html>
